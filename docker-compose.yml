services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kd
      POSTGRES_PASSWORD: kd
      POSTGRES_DB: kd_platform
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kd -d kd_platform"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
