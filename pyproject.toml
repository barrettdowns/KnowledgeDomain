[project]
name = "kd-platform"
version = "0.1.0"
description = "End-to-end Knowledge Domain platform prototype"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "psycopg[binary]>=3.1",
    "sentence-transformers>=2.2.0",
    "anthropic>=0.40.0",
    "streamlit>=1.30.0",
    "pdfplumber>=0.10.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    "graphviz>=0.20",
    "plotly>=5.18.0",
]

[tool.setuptools.packages.find]
where = ["."]
